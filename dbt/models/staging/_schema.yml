version: 2

models:
  - name: stg_players
    description: "Cleaned player universe. One row per player."
    columns:
      - name: gsis_id
        description: "Primary player identifier."
        tests:
          - not_null
          - unique

  - name: stg_schedules
    description: "Cleaned game schedules. One row per game."
    columns:
      - name: game_id
        description: "Unique game identifier."
        tests:
          - not_null
          - unique
      - name: season
        tests:
          - not_null
      - name: week
        tests:
          - not_null

  - name: stg_player_stats
    description: "Cleaned weekly player stat lines. One row per player per week."
    columns:
      - name: gsis_id
        description: "Player identifier."
        tests:
          - not_null

  - name: stg_rosters_weekly
    description: "Cleaned weekly roster snapshots. One row per player per team per week."
    columns:
      - name: gsis_id
        tests:
          - not_null

  - name: stg_pfr_pass
    description: "Cleaned PFR advanced passing stats. One row per passer per week."
    columns:
      - name: pfr_player_id
        description: "PFR player identifier. Does not join to gsis_id."
        tests:
          - not_null

  - name: stg_pfr_rush
    description: "Cleaned PFR advanced rushing stats. One row per rusher per week."
    columns:
      - name: pfr_player_id
        description: "PFR player identifier. Does not join to gsis_id."
        tests:
          - not_null

  - name: stg_pfr_rec
    description: "Cleaned PFR advanced receiving stats. One row per receiver per week."
    columns:
      - name: pfr_player_id
        description: "PFR player identifier. Does not join to gsis_id."
        tests:
          - not_null

  - name: stg_pfr_def
    description: "Cleaned PFR advanced defensive stats. One row per defender per week."
    columns:
      - name: pfr_player_id
        description: "PFR player identifier. Does not join to gsis_id."
        tests:
          - not_null
