version: 2

sources:
  - name: raw
    description: "Raw data landed by Python ingestion from nflverse. Do not transform here."
    schema: raw
    tables:
      - name: players
        description: "Full player universe — one row per player with bio, draft, and status info."
        columns:
          - name: gsis_id
            description: "Primary player identifier from nflverse."
            tests:
              - not_null
              - unique

      - name: schedules
        description: "NFL game schedules — one row per game with teams, scores, and metadata."
        columns:
          - name: game_id
            description: "Unique game identifier from nflverse."
            tests:
              - not_null
              - unique

      - name: player_stats
        description: "Weekly player stat lines — one row per player per week."
        columns:
          - name: player_id
            description: "Player identifier (maps to gsis_id in players)."
            tests:
              - not_null:
                  config:
                    severity: warn

      - name: rosters_weekly
        description: "Weekly roster snapshots — one row per player per team per week."
        columns:
          - name: gsis_id
            description: "Player identifier."
            tests:
              - not_null:
                  config:
                    severity: warn

      - name: pfr_pass
        description: "Pro Football Reference advanced passing stats — one row per passer per week."
        columns:
          - name: pfr_player_id
            description: "PFR player identifier. Not the same as gsis_id."
            tests:
              - not_null:
                  config:
                    severity: warn

      - name: pfr_rush
        description: "Pro Football Reference advanced rushing stats — one row per rusher per week."
        columns:
          - name: pfr_player_id
            description: "PFR player identifier. Not the same as gsis_id."
            tests:
              - not_null:
                  config:
                    severity: warn

      - name: pfr_rec
        description: "Pro Football Reference advanced receiving stats — one row per receiver per week."
        columns:
          - name: pfr_player_id
            description: "PFR player identifier. Not the same as gsis_id."
            tests:
              - not_null:
                  config:
                    severity: warn

      - name: pfr_def
        description: "Pro Football Reference advanced defensive stats — one row per defender per week."
        columns:
          - name: pfr_player_id
            description: "PFR player identifier. Not the same as gsis_id."
            tests:
              - not_null:
                  config:
                    severity: warn

      - name: participation
        description: >
          Play-level participation with formations and personnel — one row per
          play. Feed schema breaks between 2022 and 2023: formation vocabulary
          collapses from 7 values to 3, and offense_personnel switches from a
          skill-only list to a full 11-man list with ~14% defensive
          contamination. stg_participation handles both eras.
        columns:
          - name: nflverse_game_id
            description: "Game identifier; joins pbp on nflverse_game_id + play_id."
            tests:
              - not_null:
                  config:
                    severity: warn
