version: 2

models:
  - name: dim_player
    description: "Player dimension. One row per player with bio and status."
    columns:
      - name: gsis_id
        description: "Primary player identifier."
        tests:
          - not_null
          - unique

  - name: dim_team
    description: "Team dimension. One row per team abbreviation."
    columns:
      - name: team_abbr
        tests:
          - not_null
          - unique

  - name: dim_week
    description: "Week dimension. One row per season-week combination."
    tests:
      - unique:
          column_name: "(CAST(season AS VARCHAR) + '-' + CAST(week AS VARCHAR))"

  - name: dim_game
    description: "Game dimension. One row per NFL game."
    columns:
      - name: game_id
        tests:
          - not_null
          - unique

  - name: fact_player_week
    description: >
      Core fact table at player-week grain. Contains raw stat components.
      Fantasy points are calculated in the mart layer, not stored here.
    columns:
      - name: gsis_id
        tests:
          - not_null
    tests:
      - unique:
          column_name: "(gsis_id + '-' + CAST(season AS VARCHAR) + '-' + CAST(week AS VARCHAR))"

  - name: fact_pfr_advstats
    description: >
      Pro Football Reference advanced stats unified at player-week grain.
      Combines the passing, rushing, receiving and defensive PFR feeds, each of
      which covers a different population, so most columns are sparse by design.
      Keyed on pfr_player_id, which does NOT join to gsis_id.
    columns:
      - name: pfr_player_id
        description: "PFR player identifier. Not interchangeable with gsis_id."
        tests:
          - not_null
      - name: season
        tests:
          - not_null
      - name: week
        tests:
          - not_null
    tests:
      - unique:
          column_name: "(pfr_player_id + '-' + CAST(season AS VARCHAR) + '-' + CAST(week AS VARCHAR))"

  - name: fact_formation
    description: >
      Team formation and personnel tendencies at team-season-formation-
      personnel_grouping grain. personnel_grouping is NULL where 2023+
      offense_personnel failed validation (no single QB, or OL outside 4-6).
      Formation vocabulary differs by era: 7 values through 2022, 3 from 2023.
    columns:
      - name: team
        tests:
          - not_null
      - name: season
        tests:
          - not_null
      - name: formation
        tests:
          - not_null
      - name: play_count
        tests:
          - not_null

  - name: fact_def_formation
    description: >
      Defensive package tendencies at defensive-team-season-package-shell
      grain. The defensive team is derived via dim_game (the side not in
      possession). Named packages (Nickel, Dime, 4-3 Base, ...) with avg
      DL/LB/DB counts showing the actual front each package runs from.
    columns:
      - name: team
        tests:
          - not_null
      - name: season
        tests:
          - not_null
      - name: def_personnel_grouping
        tests:
          - not_null
      - name: play_count
        tests:
          - not_null

  - name: fact_play_matchup
    description: >
      One row per pass/run snap: pbp outcomes joined LEFT to participation
      context (formation, personnel, package, shell) on nflverse_game_id +
      play_id. NULL context means no participation row or unparsed personnel.
    columns:
      - name: nflverse_game_id
        tests:
          - not_null
      - name: play_id
        tests:
          - not_null
    tests:
      - unique:
          column_name: "(nflverse_game_id + '-' + CAST(play_id AS VARCHAR))"
