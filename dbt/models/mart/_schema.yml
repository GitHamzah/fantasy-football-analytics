version: 2

models:
  - name: mart_dim_player
    description: >
      Player dimension for Power BI. One row per player.
      Connected to fact_player_week via gsis_id.
    columns:
      - name: gsis_id
        description: "Primary player identifier. PBI relationship key."
        tests:
          - not_null
          - unique

  - name: mart_dim_team
    description: >
      Team dimension for Power BI. One row per team abbreviation.
      Connected to fact_player_week via recent_team.
    columns:
      - name: team_abbr
        description: "Team abbreviation. PBI relationship key."
        tests:
          - not_null
          - unique

  - name: mart_dim_week
    description: >
      Week dimension for Power BI. One row per season-week.
      Surrogate key (season * 100 + week) for single-column PBI relationship.
    columns:
      - name: week_key
        description: "Surrogate key: season * 100 + week. PBI relationship key."
        tests:
          - not_null
          - unique

  - name: mart_dim_game
    description: >
      Game dimension for Power BI. One row per NFL game.
      Connected to fact_player_week via game_id.
    columns:
      - name: game_id
        description: "Unique game identifier. PBI relationship key."
        tests:
          - not_null
          - unique

  - name: mart_dim_scoring_format
    description: >
      Disconnected dimension for Power BI. NOT joined to the fact table.
      Used as a slicer — DAX measures read the selected format's scoring
      weights and calculate fantasy points dynamically.
    columns:
      - name: format_name
        description: "Scoring format name. Used as PBI slicer value."
        tests:
          - not_null
          - unique

  - name: mart_fact_player_week
    description: >
      Core fact table for Power BI. One row per player per week.
      Contains raw stat measures only. Fantasy points calculated in DAX
      using the disconnected dim_scoring_format table.
    columns:
      - name: gsis_id
        description: "Player identifier. FK to dim_player."
        tests:
          - not_null
      - name: week_key
        description: "Surrogate week key. FK to dim_week."
        tests:
          - not_null

  - name: mart_pfr_advstats
    description: >
      Pro Football Reference advanced stats for Power BI. One row per player
      per week, combining passing, rushing, receiving and defensive measures.
      Keyed on pfr_player_id, which does not relate to gsis_id — this table is
      not directly joinable to fact_player_week.
    columns:
      - name: pfr_player_id
        tests:
          - not_null
      - name: week_key
        description: "Surrogate week key: season * 100 + week."
        tests:
          - not_null

  - name: mart_team_defense
    description: >
      Team defensive quality metrics per season. Aggregated from individual
      defensive player stats. Used for matchup analysis — pressure rate,
      coverage quality, and playmaker frequency.
    columns:
      - name: team
        tests:
          - not_null
      - name: season
        tests:
          - not_null
