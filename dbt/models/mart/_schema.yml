version: 2

models:
  - name: mart_dim_player
    description: >
      Player dimension for Power BI. One row per player.
      Connected to fact_player_week via gsis_id.
    columns:
      - name: gsis_id
        description: "Primary player identifier. PBI relationship key."
        tests:
          - not_null
          - unique

  - name: mart_dim_team
    description: >
      Team dimension for Power BI. One row per team abbreviation.
      Connected to fact_player_week via recent_team.
    columns:
      - name: team_abbr
        description: "Team abbreviation. PBI relationship key."
        tests:
          - not_null
          - unique

  - name: mart_dim_week
    description: >
      Week dimension for Power BI. One row per season-week.
      Surrogate key (season * 100 + week) for single-column PBI relationship.
    columns:
      - name: week_key
        description: "Surrogate key: season * 100 + week. PBI relationship key."
        tests:
          - not_null
          - unique

  - name: mart_dim_game
    description: >
      Game dimension for Power BI. One row per NFL game.
      Connected to fact_player_week via game_id.
    columns:
      - name: game_id
        description: "Unique game identifier. PBI relationship key."
        tests:
          - not_null
          - unique

  - name: mart_dim_scoring_format
    description: >
      Disconnected dimension for Power BI. NOT joined to the fact table.
      Used as a slicer — DAX measures read the selected format's scoring
      weights and calculate fantasy points dynamically.
    columns:
      - name: format_name
        description: "Scoring format name. Used as PBI slicer value."
        tests:
          - not_null
          - unique

  - name: mart_fact_player_week
    description: >
      Core fact table for Power BI. One row per player per week.
      Contains raw stat measures only. Fantasy points calculated in DAX
      using the disconnected dim_scoring_format table.
    columns:
      - name: gsis_id
        description: "Player identifier. FK to dim_player."
        tests:
          - not_null
      - name: week_key
        description: "Surrogate week key. FK to dim_week."
        tests:
          - not_null

  - name: mart_pfr_advstats
    description: >
      Pro Football Reference advanced stats for Power BI. One row per player
      per week, combining passing, rushing, receiving and defensive measures.
      Keyed on pfr_player_id, which does not relate to gsis_id — this table is
      not directly joinable to fact_player_week.
    columns:
      - name: pfr_player_id
        tests:
          - not_null
      - name: week_key
        description: "Surrogate week key: season * 100 + week."
        tests:
          - not_null

  - name: mart_team_defense
    description: >
      Team defensive quality metrics per season. Aggregated from individual
      defensive player stats. Used for matchup analysis — pressure rate,
      coverage quality, and playmaker frequency.
    columns:
      - name: team
        tests:
          - not_null
      - name: season
        tests:
          - not_null

  - name: mart_formation
    description: >
      Formation and personnel tendencies for the API layer. One row per
      team-season-formation-personnel grouping. Passthrough of fact_formation.
    columns:
      - name: team
        tests:
          - not_null
      - name: season
        tests:
          - not_null

  - name: mart_def_formation
    description: >
      Defensive package and coverage-shell tendencies for the API layer.
      Passthrough of fact_def_formation.
    columns:
      - name: team
        tests:
          - not_null
      - name: season
        tests:
          - not_null

  - name: mart_player_vs_defense
    description: >
      Player performance vs defense-package-shell, three roles stacked (WR/TE, RB, QB). attempts = targets/carries/dropbacks by role.
    columns:
      - name: season
        tests:
          - not_null

  - name: mart_team_matchup
    description: >
      Offense vs defense by package and shell, one row per offense-defense-season-package-shell.
    columns:
      - name: season
        tests:
          - not_null

  - name: mart_my_roster
    description: >
      Hamzah's 2026 Sleeper rosters joined to 2025 production and coverage-shell matchup splits.
    columns:
      - name: league_id
        tests:
          - not_null

  - name: mart_league_standings
    description: >
      2026 Sleeper league standings, one row per manager per league, with league settings for API summaries.
    columns:
      - name: league_id
        tests:
          - not_null

  - name: mart_league_matchup
    description: >
      Weekly Sleeper head-to-head scores with manager names, all seasons.
    columns:
      - name: league_id
        tests:
          - not_null

  - name: mart_schedule_projection
    description: >
      Scheme-adjusted 2026 weekly projections: player x game, weighting 2025 per-shell production by the opponent's 2025 shell mix.
    columns:
      - name: player_id
        tests:
          - not_null

  - name: mart_season_projection
    description: >
      Season rollup of schedule_projection: one row per player with totals and average matchup score.
    columns:
      - name: player_id
        tests:
          - not_null
